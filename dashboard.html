<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard - Dark Academy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Dashboard</h1>
    <div id="welcome"></div>
    
    <div class="mode-buttons">
        <button onclick="showMode('bedwars')">BedWars</button>
        <button onclick="showMode('fortnite')">Fortnite</button>
    </div>

    <div id="mode-container"></div>

    <h2>Ranking</h2>
    <div id="ranking-container"></div>

    <div id="chat-container" style="display:none;">
        <h3>Chat com <span id="chat-with"></span></h3>
        <div id="chat-messages" style="height:200px; overflow:auto; border:1px solid #ccc;"></div>
        <input type="text" id="chat-input" placeholder="Mensagem">
        <button onclick="sendMessage()">Enviar</button>
        <button onclick="closeChat()">Fechar Chat</button>
    </div>

    <!-- Scripts Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
