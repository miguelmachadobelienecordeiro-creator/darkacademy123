<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dark Academy - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-register">
        <h1>Cadastro</h1>
        <input type="text" id="register-nick" placeholder="Nick">
        <input type="email" id="register-email" placeholder="Email">
        <input type="password" id="register-password" placeholder="Senha">
        <button onclick="register()">Cadastrar</button>
        <p>Já tem conta? <a href="index.html">Login</a></p>
    </div>

    <!-- Scripts Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
